  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      display:flex;justify-content:center;align-items:center;
      min-height:100vh;color:#333;margin:0;
    }
    .container {
      width:90%;max-width:800px;background:#fff;
      box-shadow:0px 10px 20px rgba(0,0,0,0.2);
      border-radius:16px;padding:20px 30px;
    }
    h1 {text-align:center;margin-bottom:20px;}
    
    /* Style cho input group */
    .input-group {
      display: flex;
      gap: 10px;
      margin: 10px 0;
    }
    .input-group input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 2px solid #ddd;
      font-size: 1rem;
      outline: none;
    }
    .input-group input:focus {
      border-color: #007BFF;
    }
    .input-group button {
      flex: 0 0 auto;
      padding: 12px 20px;
      margin: 0;
      width: auto;
      background: #28a745;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .input-group button:hover {
      background: #218838;
    }
    .info-text {
      font-size: 0.85rem;
      color: #888;
      text-align: center;
      margin: 5px 0 10px 0;
    }
    
    select, button {
      width:100%;padding:12px;margin:10px 0;
      border-radius:8px;border:none;font-size:1rem;
      background:#f9f9f9;
    }
    button {
      background:#007BFF;color:#fff;font-weight:bold;cursor:pointer;
    }
    button:hover {background:#0056b3;}
    ul {list-style:none;padding:0;margin:20px 0;max-height:300px;overflow-y:auto;border:1px solid #ddd;border-radius:8px;}
    li {padding:10px 15px;border-bottom:1px solid #eee;}
    li:last-child{border-bottom:none;}
    li a {text-decoration:none;color:#007BFF;}
  </style>
</head>

    // --- DOM ---
    const groupMainSelector = document.getElementById('groupMainSelector');
    const groupSubSelector = document.getElementById('groupSubSelector');
    const linkList = document.getElementById('linkList');
    const prefixSelector = document.getElementById('prefixSelector');
    const customInput = document.getElementById('customPrefix');
    const applyCustomBtn = document.getElementById('applyCustomBtn'); // Đã sửa lại ID cho khớp HTML

    // Populate sub-select khi chọn nhóm lớn
    groupMainSelector.addEventListener('change', () => {
      const selectedMain = groupMainSelector.value;
      groupSubSelector.innerHTML = '<option value="">-- Chọn loại link --</option>';
      linkList.innerHTML = '';
      if (allGroups[selectedMain]) {
        Object.keys(allGroups[selectedMain]).forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.textContent = sub;
          groupSubSelector.appendChild(opt);
        });
      }
    });

    // Hàm lấy prefix hiện tại
    function getPrefix() {
      return prefixSelector.value.trim();
    }

    // Render danh sách link (áp prefix nếu chọn)
    function renderLinks() {
      const main = groupMainSelector.value;
      const sub = groupSubSelector.value;
      linkList.innerHTML = '';
      const prefix = getPrefix();
      if (allGroups[main] && allGroups[main][sub]) {
        allGroups[main][sub].forEach(link => {
          let displayLink = link;
          if (prefix && link.includes('/global')) {
            displayLink = prefix + link.slice(link.indexOf('/global'));
          }
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = displayLink;
          a.textContent = displayLink;
          a.target = "_blank";
          li.appendChild(a);
          linkList.appendChild(li);
        });
      }
    }

    // Khi thay đổi loại link hoặc prefix -> render lại
    groupSubSelector.addEventListener('change', renderLinks);
    prefixSelector.addEventListener('change', renderLinks);

// === MỞ LINK MƯỢT (ĐÃ TỐI ƯU) ===
document.getElementById('openLinks').addEventListener('click', function() {
  const main = groupMainSelector.value;
  const sub = groupSubSelector.value;
  const prefix = getPrefix();
  
  if (!main || !sub) {
    alert('Vui lòng chọn nhóm và loại link!');
    return;
  }
  
  const links = allGroups[main]?.[sub];
  if (!links || links.length === 0) {
    alert('Không có link!');
    return;
  }
  
  // Kiểm tra pop-up blocker 1 lần duy nhất (nhẹ hơn)
  let popupBlocked = false;
  const testWindow = window.open('about:blank', '_blank');
  if (!testWindow || testWindow.closed || typeof testWindow.closed === 'undefined') {
    popupBlocked = true;
  } else {
    testWindow.close();
  }
  
  if (popupBlocked) {
    const confirmOpen = confirm(
      `⚠️ Trình duyệt đang chặn pop-up!\n\n` +
      `Để mở ${links.length} link cùng lúc, bạn cần cho phép pop-up.\n\n` +
      `🔥 CÁCH BẬT POP-UP:\n` +
      `- Chrome: Click biểu tượng 🚫 trên thanh địa chỉ → Chọn "Always allow pop-ups"\n` +
      `- Firefox: Click biểu tượng 🚫 → Chọn "Allow pop-ups"\n` +
      `- Edge: Click biểu tượng 🚫 → Chọn "Always allow"\n\n` +
      `👉 Bấm OK để thử mở (có thể bị chặn vài link)`
    );
    if (!confirmOpen) return;
  }
  
  // Tiến hành mở link ngay lập tức (không setTimeout)
  this.disabled = true;
  this.textContent = `⏳ Đang mở ${links.length} link...`;
  
  // Vòng lặp trực tiếp (Mượt hơn nhiều)
  links.forEach((link, index) => {
      let url = link;
      if (prefix && link.includes('/global')) {
        url = prefix + link.slice(link.indexOf('/global'));
      }
      window.open(url, '_blank');
  });
  
  // Hoàn tất
  setTimeout(() => {
      this.disabled = false;
      this.textContent = '✅ Đã mở xong!';
      setTimeout(() => {
        this.textContent = 'Mở Link';
      }, 2000);
  }, 500);
});

    // === THÊM CHỨC NĂNG NHẬP LINK CUSTOM ===
    applyCustomBtn.addEventListener('click', function() {
      const customLink = customInput.value.trim();
      
      if (!customLink) {
        alert('Vui lòng nhập link thay thế!');
        return;
      }
      
      // Kiểm tra xem link đã có trong select chưa
      let found = false;
      for (let i = 0; i < prefixSelector.options.length; i++) {
        if (prefixSelector.options[i].value === customLink) {
          found = true;
          prefixSelector.selectedIndex = i;
          break;
        }
      }
      
      // Nếu chưa có thì thêm mới
      if (!found) {
        const option = document.createElement('option');
        option.value = customLink;
        option.textContent = customLink + ' (custom)';
        prefixSelector.appendChild(option);
        prefixSelector.value = customLink;
      }
      
      // Cập nhật danh sách link
      renderLinks();
      customInput.value = '';
    });

    // Cho phép nhấn Enter để áp dụng
    customInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        applyCustomBtn.click();
      }
    });
  </script>
